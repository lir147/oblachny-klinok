name: Проверка связи

on:
  workflow_dispatch:
  schedule:
    - cron: '22 */3 * * *'

permissions:
  contents: write

concurrency:
  group: netcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить серверы и игроков
        run: node .github/scripts/netcheck.mjs
      - name: Сохранить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netcheck.md
          git diff --cached --quiet || (git commit -m "Проверка связи" && (git push || (git pull --rebase && git push)))
