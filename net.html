<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка связи — Облачный клинок</title>
<style>
:root{--bg:#0d1220;--panel:#151c30;--line:#2c3a5c;--paper:#ebe5d5;--muted:#98a1b6;--gold:#e0b04f;--ok:#7aff9a;--bad:#ff8a80}
body{margin:0;background:var(--bg);color:var(--paper);font:16px/1.45 "PT Sans Narrow",Arial,sans-serif;padding:16px}
main{max-width:760px;margin:0 auto;display:grid;gap:12px}
h1{font:400 26px Georgia,serif;color:var(--gold);margin:0}
p{margin:0;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{width:46%}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wait{color:var(--muted)}
#sum{padding:10px 12px;border:1px solid var(--gold);border-radius:8px;background:#1a1408}
small{color:var(--muted)}
</style></head><body><main>
<h1>Проверка связи</h1>
<p>Страница проверяет, какие способы связи работают в вашей сети. Подождите около 20 секунд — результат сам отправится автору игры.</p>
<table id="tbl"></table>
<div id="sum">Идёт проверка…</div>
<small id="ua"></small>
</main>
<script>
const MQ_TE = new TextEncoder(), MQ_TD = new TextDecoder();
function mqStr(s) { const b = MQ_TE.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
function mqPacket(head, body) {
  const len = [], out = [head]; let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
  return new Uint8Array(out.concat(len, body));
}
function mqConnect(url, cid, will, timeout) {
  return new Promise(resolve => {
    let user = null, pass = null;
    { const m = url.match(/^(wss?:\/\/)([^:@/]+):([^@/]*)@(.*)$/); if (m) { user = decodeURIComponent(m[2]); pass = decodeURIComponent(m[3]); url = m[1] + m[4]; } }
    let ws, done = false, buf = new Uint8Array(0), pid = 1, ping = null;
    const api = { url, onmsg: null, onclose: null, open: false, bytes: 0,
      pub(topic, str, retain) { if (!api.open) return; try { const pk = mqPacket(0x30 | (retain ? 1 : 0), [...mqStr(topic), ...MQ_TE.encode(str)]); api.bytes += pk.length; api.lastPub = Date.now(); if (!api.pend) api.pend = api.lastPub; ws.send(pk); } catch (e) {} },
      sub(filter) { if (!api.open) return; pid = pid % 60000 + 1; try { ws.send(mqPacket(0x82, [pid >> 8, pid & 255, ...mqStr(filter), 0])); } catch (e) {} },
      close() { try { ws.send(new Uint8Array([0xe0, 0])); ws.close(); } catch (e) {} } };
    const finish = ok => { if (done) return; done = true; clearTimeout(tm); resolve(ok ? api : null); if (!ok) try { ws.close(); } catch (e) {} };
    const tm = setTimeout(() => finish(false), timeout || 7000);
    try { ws = new WebSocket(url, ['mqtt']); } catch (e) { finish(false); return; }
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      const flags = 0x02 | (will ? 0x04 : 0) | (user != null ? 0x80 : 0) | (pass != null ? 0x40 : 0);
      const body = [...mqStr('MQTT'), 4, flags, 0, 40, ...mqStr(cid)];
      if (will) body.push(...mqStr(will[0]), ...mqStr(will[1]));
      if (user != null) body.push(...mqStr(user)); if (pass != null) body.push(...mqStr(pass));
      ws.send(mqPacket(0x10, body));
    };
    ws.onmessage = ev => {
      const add = new Uint8Array(ev.data), nb = new Uint8Array(buf.length + add.length); api.bytes += add.length; nb.set(buf); nb.set(add, buf.length); buf = nb;
      for (;;) {
        if (buf.length < 2) break;
        let mul = 1, len = 0, i = 1, b;
        do { if (i >= buf.length) return; b = buf[i++]; len += (b & 127) * mul; mul *= 128; } while (b & 128);
        if (buf.length < i + len) break;
        const type = buf[0] >> 4, qos = (buf[0] >> 1) & 3, p = buf.subarray(i, i + len); buf = buf.slice(i + len);
        if (type === 2) { if (p[1] === 0) { api.open = true; ping = setInterval(() => { try { ws.send(new Uint8Array([0xc0, 0])); } catch (e) {} }, 20000); finish(true); } else finish(false); }
        else if (type === 3) { const tl = (p[0] << 8) | p[1], topic = MQ_TD.decode(p.subarray(2, 2 + tl)); const body = MQ_TD.decode(p.subarray(2 + tl + (qos ? 2 : 0))); if (api.onmsg) try { api.onmsg(topic, body); } catch (e) { console.warn(e); } }
      }
    };
    ws.onclose = ws.onerror = () => { const was = api.open; api.open = false; clearInterval(ping); finish(false); if (was && api.onclose) { const f = api.onclose; api.onclose = null; f(); } };
  });
}

const $ = id => document.getElementById(id);
const rid = Math.random().toString(36).slice(2, 10);
const R = {};
const tests = [];
function row(key, name) { const tr = document.createElement('tr'); tr.innerHTML = '<td></td><td class="wait">проверяю…</td>'; tr.firstChild.textContent = name; $('tbl').appendChild(tr); R[key] = { name, ok: null, info: '' }; return (ok, info) => { R[key].ok = ok; R[key].info = info; tr.lastChild.className = ok ? 'ok' : 'bad'; tr.lastChild.textContent = (ok ? 'работает' : 'не работает') + (info ? ' · ' + info : ''); }; }
const MQTT = [['shiftr', 'wss://public:public@public.cloud.shiftr.io'], ['emqx', 'wss://broker.emqx.io:8084/mqtt'], ['emqxcn', 'wss://broker-cn.emqx.io:8084/mqtt'], ['hivemq', 'wss://broker.hivemq.com:8884/mqtt'], ['eclipse', 'wss://mqtt.eclipseprojects.io:443/mqtt'], ['mosq', 'wss://test.mosquitto.org:8081/mqtt']];
const live = [];
for (const [k, url] of MQTT) {
  const done = row(k, 'MQTT ' + url.replace(/wss:\/\/([^@]*@)?/, '') + (k === 'shiftr' ? ' (порт 443)' : ''));
  tests.push((async () => {
    const t0 = performance.now();
    const c = await mqConnect(url, 'nt_' + rid + '_' + k, null, 12000);
    if (!c) return done(false, 'нет подключения');
    const tc = Math.round(performance.now() - t0); live.push(c);
    const topic = 'oblklinok/v2/ntping/' + rid + k; let got = 0;
    c.onmsg = t => { if (t === topic) got++; };
    c.sub(topic); await new Promise(r => setTimeout(r, 1200));
    for (let i = 0; i < 4; i++) { c.pub(topic, 'x'.repeat(i ? 3000 : 10)); await new Promise(r => setTimeout(r, 400)); }
    await new Promise(r => setTimeout(r, 6000));
    done(got > 0, 'подключение ' + tc + ' мс, эхо ' + got + ' из 4' + (got > 0 && got < 4 ? ' (обрывается)' : ''));
  })());
}
{ const done = row('ntfy', 'ntfy.sh (WebSocket, порт 443)');
  tests.push((async () => { try {
    const topic = 'okl_' + rid; let got = false;
    const ws = new WebSocket('wss://ntfy.sh/' + topic + '/ws');
    await new Promise((res, rej) => { ws.onopen = res; ws.onerror = rej; setTimeout(rej, 10000); });
    ws.onmessage = e => { try { if (JSON.parse(e.data).event === 'message') got = true; } catch (er) {} };
    await new Promise(r => setTimeout(r, 800));
    await fetch('https://ntfy.sh/' + topic, { method: 'POST', body: 'ping' });
    await new Promise(r => setTimeout(r, 5000)); ws.close();
    done(got, got ? '' : 'сообщение не пришло');
  } catch (e) { done(false, 'нет подключения'); } })()); }
for (const [k, url, name] of [['pmecho', 'wss://ws.postman-echo.com/raw', 'Postman echo (WebSocket, 443)'], ['wsorg', 'wss://echo.websocket.org', 'echo.websocket.org (WebSocket, 443)']]) {
  const done = row(k, name);
  tests.push((async () => { try {
    const ws = new WebSocket(url); let got = 0;
    await new Promise((res, rej) => { ws.onopen = res; ws.onerror = rej; setTimeout(rej, 10000); });
    ws.onmessage = e => { if (String(e.data).startsWith('ping')) got++; };
    for (let i = 0; i < 4; i++) { ws.send('ping' + 'x'.repeat(i ? 3000 : 1)); await new Promise(r => setTimeout(r, 400)); }
    await new Promise(r => setTimeout(r, 4000)); ws.close();
    done(got > 0, 'эхо ' + got + ' из 4');
  } catch (e) { done(false, 'нет подключения'); } })());
}
for (const [k, url, name] of [['gstatic', 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js', 'Google (Firebase) — загрузка'], ['ghapi', 'https://api.github.com/zen', 'GitHub API'], ['jsd', 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/package.json', 'jsDelivr CDN']]) {
  const done = row(k, name);
  tests.push((async () => { try { const t0 = performance.now(); const r = await fetch(url, { cache: 'no-store' }); const b = await r.text(); done(r.ok, Math.round(performance.now() - t0) + ' мс, ' + b.length + ' байт'); } catch (e) { done(false, 'нет связи'); } })());
}
$('ua').textContent = navigator.userAgent;
Promise.all(tests).then(() => {
  const ok = Object.values(R).filter(r => r.ok).map(r => r.name), payload = JSON.stringify({ id: rid, t: Date.now(), ua: navigator.userAgent.slice(0, 200), r: R });
  for (const c of live) c.pub('oblklinok/v2/nettest/' + rid, payload, true);
  $('sum').textContent = 'Готово. Результат отправлен автору игры (код ' + rid + '). Можно закрыть страницу.';
  setTimeout(() => live.forEach(c => c.close()), 3000);
});
</script></body></html>
